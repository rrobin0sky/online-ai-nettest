[package]
name = "netpathlens-pro"
version = "0.1.0"
description = "NetPath-Lens Pro - macOS Enterprise Diagnostic Pipeline & Root Cause Analyzer"
authors = ["NetPath-Lens Pro Team"]
edition = "2021"

[lib]
name = "netpathlens_pro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
